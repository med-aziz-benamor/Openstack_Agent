version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openstack-admin-api
    ports:
      - "8000:8000"
    environment:
      - MAX_UPLOAD_SIZE_MB=100
      - TEMP_DIR=/tmp
      - LOG_LEVEL=info
    volumes:
      - /tmp/openstack-admin:/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: openstack-admin-nginx
    ports:
      - "8088:80"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
